name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: MapChooser

      - name: Checkout dependencies
        run: |
          git clone --depth 1 https://github.com/Pisex/SchemaEntity.git SchemaEntity
          git clone --recurse-submodules https://github.com/alliedmodders/metamod-source.git mmsource
          git -C mmsource checkout 465f1a02081996a0eb0665a9fa0189c092a82936  # Metamod:Source 2.0.0-dev build 1411
          git -C mmsource submodule update --init --recursive
          git clone -b cs2 https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 checkout $(git -C hl2sdk-cs2 rev-list -n1 --before='2025-10-18' HEAD)  # SDK state SchemaEntity was written against
          sed -i 's/NetworkStateChanged_t/NetworkStateChangedData/g' SchemaEntity/schemasystem.cpp
          git clone --depth 1 https://github.com/alliedmodders/ambuild.git ambuild

      - name: Install AMBuild
        id: amb
        continue-on-error: true
        shell: bash
        run: |
          set -x; exec > >(tee -a $GITHUB_WORKSPACE/log.txt) 2>&1; python3 --version
          cd ambuild && python3 setup.py install

      - name: Build
        working-directory: MapChooser
        shell: bash
        run: |
          exec > >(tee -a $GITHUB_WORKSPACE/log.txt) 2>&1
          mkdir build && cd build
          python3 ../configure.py --plugin-name=MapChooser --plugin-alias=map_chooser \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/MapChooser/hl2sdk-manifests" --hl2sdk-root="$GITHUB_WORKSPACE" \
            --mms_path="$GITHUB_WORKSPACE/mmsource" --sdks=cs2 --targets=x86_64 --enable-optimize
          ambuild

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MapChooser-linux
          path: MapChooser/build/package

      - name: Publish log
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/MapChooser
          git config --global --add safe.directory '*'
          git config user.name bot; git config user.email bot@x
          git checkout --orphan buildlog
          git rm -rf . -q || true
          cp $GITHUB_WORKSPACE/log.txt log.txt || echo nolog > log.txt
          git add log.txt && git commit -qm log && git push -f origin buildlog
