name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: MapChooser

      - name: Checkout dependencies
        run: |
          git clone --depth 1 https://github.com/Pisex/SchemaEntity.git SchemaEntity
          git clone --recurse-submodules https://github.com/alliedmodders/metamod-source.git mmsource
          git -C mmsource checkout 7ec0f16
          git -C mmsource submodule update --init --recursive
          git clone -b cs2 https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 checkout $(git -C hl2sdk-cs2 rev-list -n1 --before='2025-10-18' HEAD)
          ln -s KeyValues.h hl2sdk-cs2/public/tier1/keyvalues.h
          sed -i 's/FL_PAWN_FAKECLIENT/FL_FAKECLIENT/g;s/FL_CONTROLLER_FAKECLIENT/FL_FAKECLIENT/g' SchemaEntity/*.h
          sed -i 's/NetworkStateChanged_t/NetworkStateChangedData/g' SchemaEntity/schemasystem.cpp
          git clone --depth 1 https://github.com/alliedmodders/ambuild.git ambuild

      - name: Install AMBuild
        id: amb
        continue-on-error: true
        shell: bash
        run: |
          set -x; exec > >(tee -a $GITHUB_WORKSPACE/log.txt) 2>&1; python3 --version
          cd ambuild && python3 setup.py install

      - name: Build
        working-directory: MapChooser
        shell: bash
        run: |
          set -o pipefail
          mkdir build && cd build
          python3 ../configure.py --plugin-name=MapChooser --plugin-alias=map_chooser \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/MapChooser/hl2sdk-manifests" --hl2sdk-root="$GITHUB_WORKSPACE" \
            --mms_path="$GITHUB_WORKSPACE/mmsource" --sdks=cs2 --targets=x86_64 --enable-optimize \
            2>&1 | tee configure.log
          if [[ ! -f .ambuild2/vars ]]; then
              message=$(tail -n 30 configure.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error title=Configure failed::$message"
              exit 1
          fi
          ambuild 2>&1 | tee build.log || {
            message=$(grep -Ei 'fatal error:|(^|[ :])error:|undefined reference|Build failed' build.log | tail -n 30 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Compile failed::$message"
            exit 1
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MapChooser-linux
          path: MapChooser/build/package

      - name: Zip package
        run: cd MapChooser/build/package && python3 -c "import shutil; shutil.make_archive('$GITHUB_WORKSPACE/MapChooser-linux','zip','.')"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-${{ github.run_number }}
          name: MapChooser v1.2 (build ${{ github.run_number }}, Pisex API)
          body: |
            Linux x86_64 build using the API headers from Pisex/cs2-map-chooser and its SchemaEntity-compatible HL2SDK revision.
            Fixes RTV round-end map changes and uses ds_workshop_changelevel for Workshop maps.
            Unpack `addons/` into `game/csgo/`.
          files: MapChooser-linux.zip
